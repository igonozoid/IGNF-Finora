# Só para desenvolvimento (gerar revisões). O app aplica as migrações sozinho ao abrir.
#   alembic revision --autogenerate -m "descrição em PT-BR"
# Revise sempre o arquivo gerado antes do commit.
[alembic]
script_location = src/finora/migrations
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
