[project]
name = "ignf-finora"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "SQLAlchemy>=2.0", "alembic>=1.13", "qtawesome>=1.3", "openpyxl>=3.1", "ofxparse>=0.21", "requests>=2.32", "cryptography>=44", "pymysql>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]
build = ["pyinstaller>=6.10"]

[project.scripts]
finora = "finora.__main__:main"

[tool.setuptools.package-data]
# vão junto no pacote (e no app empacotado): fontes do mockup e o modelo das migrações
finora = ["assets/fonts/*", "migrations/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
