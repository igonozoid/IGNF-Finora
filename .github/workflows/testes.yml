name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]   # prioridade: Windows, depois Linux (docs/ROADMAP.md)
    env:
      QT_QPA_PLATFORM: offscreen               # telas testadas sem abrir janela
      FINORA_DATA_DIR: ${{ github.workspace }}/.dados-ci
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bibliotecas do Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Instalar o Finora e as dependências de teste
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Rodar os testes
        run: python -m pytest -q --durations=5
